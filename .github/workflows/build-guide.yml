name: Build TV guide

# Rebuilds the pruned XMLTV guide twice a day and whenever IPTV Control Room pushes a change.
on:
  schedule:
    - cron: '23 3,15 * * *'
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  actions: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5

      - name: Build guide
        run: node build-guide.mjs site

      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

      - id: deployment
        uses: actions/deploy-pages@v5

      # GitHub pauses scheduled workflows in repositories without activity for 60 days.
      # Re-enabling the workflow on every run keeps the twice-daily schedule alive indefinitely.
      - name: Keep the schedule alive
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/build-guide.yml/enable"
